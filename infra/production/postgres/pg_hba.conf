# IA-MNS PostgreSQL client authentication, written into the data directory by
# `ia-mns-deploy setup` and reloaded. Marker: ia-mns-hardened-hba-v1
#
# The superuser only connects through the container's local socket as the
# operating-system user postgres (docker exec), for setup and backups. Over the
# private network only the migration and runtime roles reach the application
# database, with SCRAM passwords. Everything else is refused.

# TYPE  DATABASE  USER             ADDRESS   METHOD
local   all       postgres                   peer
local   all       all                        reject
host    ia_mns    ia_mns_migrator  samenet   scram-sha-256
host    ia_mns    orion_runtime    samenet   scram-sha-256
host    all       all              all       reject
