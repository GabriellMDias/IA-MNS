name: ia-mns
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IA_MNS_POSTGRES_PASSWORD:?Run pnpm db:local first}
      POSTGRES_DB: ia_mns
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ia_mns"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
